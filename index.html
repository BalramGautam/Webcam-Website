<!DOCTYPE html>
<html lang="en">
<meta name="description" content="Display camera output in colourised ASCII">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#333333" />

<title> ASCIICAM</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <pre id="logo" class -="fade">
         _
   _n_|_|_,_
  |===.-.===|
  |  ((_))  |
  '==='-'==='
A S C I I C A M
    </pre>
    <pre id="enable-cam-msg" class="fade">
        Allow access to camera to use 
    </pre>
    <div id="ascii-cam" class="fade">
        <div class="layers">
            <pre id="r-output"></pre>
            <pre id="g-output"></pre>
            <pre id="b-output"></pre>
        </div>
    </div>
    <video id="video" autoplay> </video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <script src="script.js"></script>
</body>

</html>
